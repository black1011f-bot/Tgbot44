<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10051f">
<meta name="description" content="BOUNTY HUB — загрузка игры для Windows">
<title>BOUNTY HUB</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10051f;color:#fff;font-family:Arial,system-ui,sans-serif}
.stage{position:relative;width:100vw;height:100vh;min-width:960px;min-height:540px;overflow:hidden;background:#10051f}
.art-picture{position:absolute;inset:0;display:block;width:100%;height:100%;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:pan-y}
.art{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block;pointer-events:none;-webkit-user-select:none;user-select:none;-webkit-user-drag:none;-webkit-touch-callout:none}
.top-clean{position:absolute;z-index:2;top:1.5%;right:0;width:23%;height:10%;background:linear-gradient(90deg,transparent 0%,rgba(12,4,25,.94) 15%,rgba(12,4,25,.98) 92%,rgba(12,4,25,.75) 100%);pointer-events:none}
.bottom-clean{position:absolute;z-index:2;left:0;right:0;bottom:0;height:13.2%;background:linear-gradient(180deg,rgba(12,4,25,0) 0%,rgba(12,4,25,.96) 30%,#10051f 100%);pointer-events:none}
.hit{position:absolute;z-index:5;left:3.25%;width:34.1%;height:9.8%;border:0;border-radius:70px;background:transparent;cursor:pointer;padding:0}
.hit:focus-visible{outline:3px solid white;outline-offset:4px}
.hit-windows{top:50.4%}.hit-android{top:61.9%}
.toast{position:absolute;z-index:8;left:3.3%;top:73%;width:min(520px,42vw);padding:13px 18px;border:1px solid #d38aff;border-radius:14px;background:rgba(21,7,39,.96);box-shadow:0 0 22px #a941e877;color:#f5e7ff;font-size:15px;line-height:1.4;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}
.toast.show{opacity:1;transform:none}
@media(max-width:1000px){.stage{width:1000px;height:562.5px;transform-origin:top left}}
@media(max-width:700px) and (orientation:portrait){
 html,body{width:100%;height:100%;overflow:hidden}
 .stage{width:100vw;height:100dvh;min-width:0;min-height:0;transform:none}
 .art{object-fit:fill}
 .top-clean,.bottom-clean{display:none}
 .hit{left:8%;width:84%;height:8.5%;border-radius:24px}
 .hit-windows{top:auto;bottom:23%}
 .hit-android{top:auto;bottom:12%}
 .toast{left:5%;top:auto;bottom:2%;width:90%;font-size:14px}
}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<main class="stage" aria-label="BOUNTY HUB — загрузка игры">
<picture class="art-picture">
<source media="(max-width:700px), (orientation:portrait)" srcset="https://i.postimg.cc/ZKGTC3xv/IMG-20261113-110803-571.jpg">
<img class="art" src="https://i.postimg.cc/R0bpZ1wd/IMG-20261113-110211-954.jpg" alt="BOUNTY HUB — экран загрузки с кнопками Windows и Android" draggable="false">
</picture>
<div class="top-clean" aria-hidden="true"></div>
<div class="bottom-clean" aria-hidden="true"></div>
<button class="hit hit-windows" type="button" aria-label="Скачать для Windows" data-platform="Windows"></button>
<button class="hit hit-android" type="button" aria-label="Скачать для Android" data-platform="Android"></button>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</main>
<script>
const toast=document.getElementById("toast");
document.addEventListener("contextmenu",event=>{if(event.target.closest(".art-picture"))event.preventDefault()});
document.addEventListener("dragstart",event=>{if(event.target.closest(".art-picture"))event.preventDefault()});
document.addEventListener("selectstart",event=>{if(event.target.closest(".art-picture"))event.preventDefault()});
let toastTimer;
document.querySelectorAll("[data-platform]").forEach(button=>button.addEventListener("click",()=>{
  toast.textContent=button.dataset.platform==="Windows"
    ?"Версия для Windows ещё разрабатывается. Кнопка начнёт установку, когда появится готовая сборка."
    :"Версия для Android ещё разрабатывается. Установка станет доступна после публикации сборки.";
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>toast.classList.remove("show"),5000);
}));
</script>
</body>
</html>
