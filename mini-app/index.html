<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10091f">
<meta name="description" content="BOUNTY HUB — загрузка игры для Windows и Android.">
<title>BOUNTY HUB — Скачать игру</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;--bg:#0b0717;--panel:#18102d;--line:#8751c8;--violet:#b66cff;--pink:#e1a1ff;--text:#fbf7ff;--muted:#c7badb}
*{box-sizing:border-box}
html{min-height:100%;background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(ellipse at 72% 42%,#4a2670 0,transparent 42%),radial-gradient(ellipse at 18% 18%,#24113f 0,transparent 42%),linear-gradient(135deg,#090613,#130b25 60%,#090613)}
button{font:inherit}
.page{width:min(1180px,100%);margin:0 auto;padding:24px clamp(16px,4vw,46px) 26px}
header{height:58px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff20;padding-bottom:15px}
.brand{font-size:clamp(22px,3vw,30px);font-weight:950;letter-spacing:.12em}.brand span{color:#c58bff}
.status{border:1px solid #a56be477;border-radius:30px;padding:8px 13px;color:#ead7ff;background:#9f5be51c;font-size:12px;letter-spacing:.04em}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(380px,.95fr);gap:20px;align-items:center;min-height:calc(100svh - 120px);padding:24px 0 12px}
.copy{position:relative;z-index:2;padding:20px 0}
.kicker{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#d5a5ff;font-weight:800}
h1{font-size:clamp(48px,6.6vw,82px);line-height:.97;letter-spacing:-.055em;margin:18px 0 20px}
h1 span{color:#c17aff;text-shadow:0 0 32px #a855f766}
.lead{max-width:480px;font-size:clamp(16px,1.7vw,19px);line-height:1.65;color:var(--muted);margin:0 0 28px}
.pointer{display:flex;align-items:center;gap:10px;color:#e8d5ff;font-size:14px;margin:0 0 13px}
.pointer i{display:block;width:45px;height:1px;background:linear-gradient(90deg,#e5b4ff,#8a40ca);position:relative}
.pointer i:after{content:"";position:absolute;right:0;top:-4px;width:8px;height:8px;border-top:1px solid #e5b4ff;border-right:1px solid #e5b4ff;transform:rotate(45deg)}
.downloads{display:grid;gap:14px;max-width:460px}
.download{width:100%;min-height:86px;border:1px solid #bf8aff;border-radius:17px;padding:14px 20px;display:flex;align-items:center;gap:16px;text-align:left;color:white;cursor:pointer;background:linear-gradient(110deg,#6f31a9ed,#24123fef);box-shadow:0 0 25px #9c45e53d,inset 0 0 20px #d7a2ff12;transition:transform .2s,box-shadow .2s,border-color .2s}
.download:hover{transform:translateY(-3px);border-color:#f0d4ff;box-shadow:0 0 34px #ba68ff77}
.download:focus-visible{outline:3px solid white;outline-offset:4px}
.download .icon{width:48px;height:48px;display:grid;place-items:center;border:1px solid #d3a7ff88;border-radius:13px;background:#f0d5ff18;font-size:25px;font-weight:900;color:#edd6ff}
.download .label{flex:1}.download strong{display:block;font-size:19px}.download small{display:block;margin-top:4px;color:#d9c6ed;font-size:13px}
.download .arrow{font-size:28px;color:#d5a2ff;padding:0 6px}
.message{min-height:26px;margin:12px 3px 0;color:#e8d7ff;font-size:13px}
.hero-art{position:relative;min-height:590px;display:flex;align-items:center;justify-content:center;isolation:isolate}
.hero-art:before{content:"";position:absolute;z-index:-1;inset:8% 4%;border-radius:50%;background:radial-gradient(circle,#a65bea55,transparent 68%);filter:blur(24px)}
.art-frame{position:relative;width:min(100%,560px);height:min(72vh,670px);min-height:490px;display:flex;align-items:center;justify-content:center}
.art-frame:after{content:"";position:absolute;inset:7% 3%;border:1px solid #c28aff36;border-radius:48% 48% 38% 38%;transform:rotate(4deg);pointer-events:none}
.elf{position:relative;z-index:1;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 15px 42px #a55de45c);animation:appear .9s ease both}
.sticker{position:absolute;z-index:2;left:0;bottom:16%;padding:12px 15px;border:1px solid #c895ff88;border-radius:14px;background:#1a1034d9;box-shadow:0 8px 30px #07031088;color:#f1dfff;font-size:13px;animation:float 4s ease-in-out infinite}
.sticker b{color:#ddaaff}
footer{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid #ffffff20;padding-top:15px;color:#a99bbf;font-size:12px}
@keyframes appear{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
@keyframes float{50%{transform:translateY(-8px)}}
@media(max-width:760px){
 .page{padding:14px 15px 20px}header{height:52px;padding-bottom:12px}.status{font-size:11px;padding:7px 10px}
 .hero{display:flex;flex-direction:column;gap:0;min-height:unset;padding:12px 0 22px}
 .hero-art{order:0;width:100%;min-height:0;height:min(47svh,370px);margin:0 auto -2px}
 .art-frame{height:100%;min-height:0;width:min(100%,430px)}.elf{object-position:center 35%}
 .sticker{left:3%;bottom:8%;font-size:11px;padding:9px 11px}
 .copy{order:1;width:100%;padding:3px 0 0}
 h1{font-size:clamp(43px,12vw,62px);margin:12px 0 13px}
 .lead{font-size:15px;line-height:1.55;margin-bottom:17px}
 .pointer{font-size:13px;margin-bottom:10px}
 .downloads{max-width:none;gap:11px}
 .download{min-height:75px;padding:12px 14px;border-radius:15px}
 .download .icon{width:42px;height:42px;font-size:22px}.download strong{font-size:17px}.download small{font-size:12px}
 footer{margin-top:5px;flex-wrap:wrap}
}
@media(max-width:370px){.hero-art{height:300px}.download{min-height:68px}.download .arrow{font-size:23px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="page">
<header><div class="brand">✦ BOUNTY <span>HUB</span></div><div class="status">GAME PROJECT</div></header>
<main class="hero">
<section class="copy">
<div class="kicker">Один проект · Две платформы</div>
<h1>ИГРАЙ В<br><span>BOUNTY HUB</span></h1>
<p class="lead">Выбери устройство и приготовься к игре. Наша эльфийка уже показывает, куда нажать.</p>
<div class="pointer"><i></i> Выбирай свою платформу</div>
<div class="downloads">
<button class="download" type="button" data-platform="Windows">
<span class="icon" aria-hidden="true">▣</span><span class="label"><strong>Скачать для Windows</strong><small>Версия для компьютера</small></span><span class="arrow" aria-hidden="true">›</span>
</button>
<button class="download" type="button" data-platform="Android">
<span class="icon" aria-hidden="true">◈</span><span class="label"><strong>Скачать для Android</strong><small>Мобильная версия</small></span><span class="arrow" aria-hidden="true">›</span>
</button>
</div>
<div class="message" id="message" role="status" aria-live="polite"></div>
</section>
<div class="hero-art">
<div class="art-frame">
<img class="elf" src="https://img-v3.deepdreamgenerator.com/994631/md_dgbkt4_789de470a05c0eef1fc48ee41a2fbe21c98ca130.jpg" alt="Аниме-эльфийка Bounty Hub: взрослая героиня с серебряными волосами и фиолетовым плащом" referrerpolicy="no-referrer">
<div class="sticker">✦ <b>BOUNTY HUB</b><br>Выбирай платформу!</div>
</div>
</div>
</main>
<footer><span>© BOUNTY HUB</span><span>Windows — основная разработка · Android — позже</span></footer>
</div>
<script>
(function(){
 const tg=window.Telegram&&window.Telegram.WebApp;
 if(tg){tg.ready();tg.expand();try{tg.setHeaderColor("#10091f");tg.setBackgroundColor("#0b0717")}catch(e){}}
 const message=document.getElementById("message");
 const texts={
  Windows:"Версия для Windows сейчас разрабатывается. Кнопка загрузки появится после публикации сборки.",
  Android:"Android-версия пока не выпускается. Сейчас основная разработка идёт для Windows."
 };
 document.querySelectorAll("[data-platform]").forEach(function(button){
  button.addEventListener("click",function(){
   message.textContent=texts[button.getAttribute("data-platform")];
  });
 });
})();
</script>
</body>
</html>
