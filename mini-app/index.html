<!doctype html>

<title>BOUNTY HUB — Скачать игру</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0b0417;color:#fff;font-family:Inter,Arial,sans-serif}
body{min-height:100vh;overflow-x:hidden;background:radial-gradient(ellipse at 76% 45%,#582080 0,transparent 48%),radial-gradient(ellipse at 40% 10%,#301044 0,transparent 42%),linear-gradient(110deg,#090313,#170824 58%,#0b0417)}
.page{width:min(1672px,100%);min-height:100vh;margin:auto;position:relative;overflow:hidden;padding:25px 55px 36px}
.page:before{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(#bd65ff55 1px,transparent 1px);background-size:34px 34px;opacity:.12;mask-image:linear-gradient(90deg,#000,transparent 65%)}
header{height:92px;display:flex;align-items:flex-start;position:relative;z-index:3}
.brand{display:flex;align-items:center;gap:23px}.star{font-size:82px;line-height:.9;color:#c56cff;text-shadow:0 0 28px #b34dff}.brand-title{font-size:43px;line-height:1;font-weight:950;letter-spacing:-1.7px;font-style:italic;color:#e2b4ff;text-shadow:0 0 22px #b45cff88}.brand-sub{font-size:19px;letter-spacing:2px;font-weight:750;margin:7px 0 0 40px;color:#e7d8f4}
.hero{height:calc(100vh - 153px);min-height:650px;max-height:850px;display:grid;grid-template-columns:44% 56%;align-items:center;position:relative;z-index:1}
.copy{position:relative;z-index:2;padding:0 0 24px 4px}
h1{font-size:clamp(64px,5.7vw,91px);font-weight:950;font-style:italic;line-height:.98;letter-spacing:-4px;margin:0 0 26px;text-shadow:0 5px 30px #09010f}h1 span{color:#d34dff;text-shadow:0 0 28px #d344ff88}
.lead{font-size:clamp(21px,1.8vw,29px);line-height:1.32;color:#e8d9f3;margin:0 0 38px;max-width:570px}
.downloads{display:grid;gap:17px;width:min(100%,560px)}
.download{height:91px;border:2px solid #f0baff;border-radius:48px;background:linear-gradient(100deg,#841bdf,#590bb6 58%,#42117d);box-shadow:0 0 9px #d968ff,0 0 26px #c23bff88,inset 0 0 19px #edb2ff4d;display:flex;align-items:center;padding:0 31px;gap:24px;color:#fff;text-align:left;cursor:pointer;transition:.18s}
.download:hover{transform:translateY(-2px);box-shadow:0 0 14px #f3c4ff,0 0 38px #c23bffbb}
.download svg{width:49px;height:49px;fill:#fff;flex:none}.download strong{font-size:25px;font-weight:850;white-space:nowrap}.arrow{font-size:56px;font-weight:300;margin-left:auto;line-height:1;color:#f5dfff}
.features{margin-top:29px;width:min(100%,600px);height:85px;border:1px solid #bb4eff;border-radius:44px;background:#18092bdf;box-shadow:0 0 16px #a72be966;display:flex;align-items:center;justify-content:space-around}
.feature{height:48px;display:flex;align-items:center;justify-content:center;gap:12px;flex:1;font-size:18px;color:#f5eaff}.feature+.feature{border-left:1px solid #bd75ed}.feature-icon{font-size:39px;color:#c14cff;text-shadow:0 0 15px #c14cff}
.art{position:absolute;z-index:0;right:-55px;top:-4px;bottom:-38px;width:66%;pointer-events:none;display:flex;align-items:center;justify-content:flex-end}
.art img{width:100%;height:100%;object-fit:cover;object-position:center top;filter:drop-shadow(0 0 35px #bd5cff55);mask-image:linear-gradient(90deg,transparent 0%,#000 12%,#000 100%)}
.notice{min-height:24px;margin:12px 8px 0;color:#edcfff;font-size:14px;max-width:540px}
@media(max-width:1050px){.page{padding:22px 32px}.hero{grid-template-columns:48% 52%}.art{width:65%;right:-32px}.brand-title{font-size:35px}.brand-sub{font-size:16px}.star{font-size:68px}h1{font-size:clamp(55px,6vw,70px)}.download{height:78px;padding:0 22px;gap:15px}.download strong{font-size:20px}.download svg{width:40px;height:40px}.features{height:72px}.feature{font-size:15px}.feature-icon{font-size:30px}}
@media(max-height:700px) and (min-width:850px){.hero{min-height:550px}.art{bottom:-15px}.copy{padding-bottom:0}h1{font-size:65px;margin-bottom:18px}.lead{font-size:20px;margin-bottom:24px}.download{height:72px}.features{height:66px;margin-top:19px}}
</style>
</head>
<body>
<div class="page">
<header><div class="brand"><div class="star">✦</div><div><div class="brand-title">BOUNTY HUB</div><div class="brand-sub">ИГРОВОЙ ПРОЕКТ</div></div></div></header>

<button class="download" type="button" data-platform="Android"><svg viewBox="0 0 48 48"><path d="M13.4 15.5 9.6 9a1.2 1.2 0 0 1 2.1-1.2l4 6.8a18.2 18.2 0 0 1 16.6 0l4-6.8A1.2 1.2 0 0 1 38.4 9l-3.8 6.5A17.1 17.1 0 0 1 42 29H6a17.1 17.1 0 0 1 7.4-13.5ZM15 23a1.6 1.6 0 1 0 0-3.2 1.6 1.6 0 0 0 0 3.2Zm18 0a1.6 1.6 0 1 0 0-3.2 1.6 1.6 0 0 0 0 3.2ZM8 31h32v8a3 3 0 0 1-3 3h-2v4a2 2 0 0 1-4 0v-4H17v4a2 2 0 0 1-4 0v-4h-2a3 3 0 0 1-3-3v-8Z"/></svg><strong>Скачать для Android</strong><span class="arrow">›</span></button>
</div>

<div class="notice" id="notice" role="status" aria-live="polite"></div>
</section>
<div class="art"><img src="https://img-v3.deepdreamgenerator.com/994631/md_dgbkt4_789de470a05c0eef1fc48ee41a2fbe21c98ca130.jpg" alt="Героиня BOUNTY HUB в фиолетовом фэнтези-мире"></div>

</div>
<script>

</body></html>
