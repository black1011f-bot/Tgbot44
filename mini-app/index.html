<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10051f">
<meta name="description" content="BOUNTY HUB — игровой проект">
<title>BOUNTY HUB</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#10051f}
body{display:flex;justify-content:center;align-items:flex-start;overflow-x:hidden}
.page{position:relative;width:100%;max-width:1536px;line-height:0}
.art{display:block;width:100%;height:auto;pointer-events:none;-webkit-user-select:none;user-select:none;-webkit-user-drag:none;-webkit-touch-callout:none}
.mobile{display:none}
.hit{position:absolute;z-index:4;display:block;border:0;border-radius:999px;background:transparent;padding:0;margin:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.hit:focus-visible{outline:3px solid #fff;outline-offset:4px}
.desktop .windows{left:3.2%;top:51.0%;width:33.8%;height:9.7%}
.desktop .android{left:3.2%;top:62.7%;width:33.8%;height:9.7%}
.mobile{max-width:864px}
@media(max-width:700px) and (orientation:portrait){
 .desktop{display:none}
 .mobile{display:block}
 .mobile .windows{left:10.5%;top:72.5%;width:79.5%;height:7.3%}
 .mobile .android{left:10.5%;top:81.1%;width:79.5%;height:7.3%}
}
.overlay{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:22px;background:rgba(5,0,15,.8);backdrop-filter:blur(7px);line-height:1.4}
.overlay.open{display:flex}
.dialog{width:min(440px,100%);padding:27px 23px;text-align:center;color:#fff;font-family:Arial,system-ui,sans-serif;border:1px solid #d46cff;border-radius:22px;background:linear-gradient(145deg,#31005a,#10001f 75%);box-shadow:0 0 35px rgba(190,55,255,.45)}
.dialog h2{margin:0 0 12px;font-size:24px}
.dialog p{margin:0 0 22px;color:#eadcf5;font-size:16px}
.close{border:1px solid #e6b4ff;border-radius:999px;padding:11px 28px;color:#fff;font-size:15px;font-weight:700;cursor:pointer;background:linear-gradient(90deg,#8e16db,#4c0a87);touch-action:manipulation}
</style>
</head>
<body>
<main class="page desktop" aria-label="BOUNTY HUB — версия для компьютера">
 <img class="art" src="https://i.postimg.cc/brJNQs8q/IMG-20261113-110211-954.jpg" alt="BOUNTY HUB" draggable="false">
 <button class="hit windows" type="button" aria-label="Скачать для Windows" data-platform="Windows"></button>
 <button class="hit android" type="button" aria-label="Скачать для Android" data-platform="Android"></button>
</main>
<main class="page mobile" aria-label="BOUNTY HUB — мобильная версия">
 <img class="art" src="https://i.postimg.cc/KvCvMGWY/IMG-20261113-110803-571.jpg" alt="BOUNTY HUB" draggable="false">
 <button class="hit windows" type="button" aria-label="Скачать для Windows" data-platform="Windows"></button>
 <button class="hit android" type="button" aria-label="Скачать для Android" data-platform="Android"></button>
</main>
<div class="overlay" id="notice" role="dialog" aria-modal="true" aria-labelledby="noticeTitle">
 <div class="dialog">
  <h2 id="noticeTitle">Игра в разработке</h2>
  <p id="noticeText">Версия для Windows пока разрабатывается. Следите за новостями BOUNTY HUB!</p>
  <button class="close" type="button" id="closeNotice">Понятно</button>
 </div>
</div>
<script>
const notice=document.getElementById('notice');
const noticeText=document.getElementById('noticeText');
document.querySelectorAll('[data-platform]').forEach(button=>{
 button.addEventListener('click',()=>{
  const platform=button.dataset.platform;
  noticeText.textContent='Версия для '+platform+' пока разрабатывается. Следите за новостями BOUNTY HUB!';
  notice.classList.add('open');
 });
});
document.getElementById('closeNotice').addEventListener('click',()=>notice.classList.remove('open'));
notice.addEventListener('click',event=>{if(event.target===notice)notice.classList.remove('open')});
document.addEventListener('keydown',event=>{if(event.key==='Escape')notice.classList.remove('open')});
// Убираем стандартное меню сохранения/открытия картинки и перетаскивание.
document.addEventListener('contextmenu',event=>event.preventDefault());
document.addEventListener('dragstart',event=>event.preventDefault());
document.addEventListener('selectstart',event=>event.preventDefault());
</script>
</body>
</html>
