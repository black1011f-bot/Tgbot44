
name: Build Bounty Hub APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Unpack project
        run: |
          set -e
          ZIP_FILE="BOUNTY_HUB_NEON_LEGENDS_V5_SOURCE.zip"
          test -f "$ZIP_FILE"
          mkdir -p source
          unzip -q "$ZIP_FILE" -d source
          PACKAGE_FILE=$(find source -name package.json -not -path '*/node_modules/*' -print -quit)
          test -n "$PACKAGE_FILE"
          APP_DIR=$(dirname "$PACKAGE_FILE")
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      - name: Install and prepare Android
        run: |
          set -e
          cd "$APP_DIR"
          npm install --no-audit --no-fund
          npm run check
          npm run verify
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build APK
        run: |
          cd "$APP_DIR/android"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Bounty-Hub-APK
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
