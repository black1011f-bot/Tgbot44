
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and unpack project ZIP
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname 'BOUNTY_HUB_NEON_LEGENDS_V5_SOURCE*.zip' -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP archive not found!"
            echo "Files in repository:"
            ls -la
            exit 1
          fi
          echo "Found archive: $ZIP_FILE"
          mkdir -p project
          unzip -o "$ZIP_FILE" -d project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Find Gradle project
        run: |
          set -e
          if [ -f project/gradlew ]; then
            echo "GRADLE_DIR=project" >> "$GITHUB_ENV"
          else
            GRADLE_FILE=$(find project -name gradlew -type f -print -quit)
            if [ -z "$GRADLE_FILE" ]; then
              echo "ERROR: gradlew not found in archive"
              find project -maxdepth 4 -type f | head -200
              exit 1
            fi
            echo "GRADLE_DIR=$(dirname "$GRADLE_FILE")" >> "$GITHUB_ENV"
          fi

      - name: Grant Gradle permission
        run: chmod +x "$GRADLE_DIR/gradlew"

      - name: Build APK
        run: |
          cd "$GRADLE_DIR"
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BOUNTY-HUB-NEON-LEGENDS-APK
          path: |
            ${{ env.GRADLE_DIR }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
