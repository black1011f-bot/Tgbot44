
name: Build Bounty Hub APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Unpack project
        run: |
          unzip -q Bounty_Hub_Cloud_Build_Package.zip -d source
          cd source/Bounty_Hub_App
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd source/Bounty_Hub_App/android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Bounty-Hub-APK
          path: source/Bounty_Hub_App/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
