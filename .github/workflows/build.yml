
name: Build Bounty Hub APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract source
        run: |
          set -e
          ZIP=$(find . -maxdepth 1 -iname 'BOUNTY_HUB_NEON_LEGENDS_V5_SOURCE*.zip' -print -quit)
          test -n "$ZIP"
          mkdir project
          unzip -q "$ZIP" -d project

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: project/Bounty_Hub_App/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install app dependencies
        working-directory: project/Bounty_Hub_App
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Prepare Capacitor Android
        working-directory: project/Bounty_Hub_App
        run: |
          set -e
          npm install @capacitor/android
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build APK
        working-directory: project/Bounty_Hub_App/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BOUNTY-HUB-NEON-LEGENDS
          path: project/Bounty_Hub_App/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
